name: Update Lotto Winning Stores

on:
  schedule:
    - cron: '0 12 * * 6'
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-stores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update winning stores
        run: |
          python update_stores.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stores

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update lotto winning stores"
            git push
          fi